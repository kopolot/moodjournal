# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    mailer.from_address: '%env(MAILER_FROM_ADDRESS)%'
    app.url: '%env(APP_URL)%'
    app.days_to_delete_disabled_user: '%env(APP_DAYS_TO_DELETE_DISABLED_USER)%'
    env(STRIPE_SECRET_KEY): ''
    env(STRIPE_WEBHOOK_SECRET): ''
    env(STRIPE_PRICE_PLUS): ''
    env(STRIPE_PRICE_PRO): ''
    env(OPENAI_API_KEY): ''
    env(OPENAI_BASE_URL): ''
    env(OPENAI_MODEL): 'gpt-4o-mini'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\MoodService:
        arguments:
            $moodCache: '@cache.mood'

    App\Service\MoodAnalysisService:
        arguments:
            $moodCache: '@cache.mood'

    App\Service\OpenAiCompatibleClient:
        arguments:
            $apiKey: '%env(string:default::OPENAI_API_KEY)%'
            $baseUrl: '%env(string:default::OPENAI_BASE_URL)%'
            $model: '%env(string:default::OPENAI_MODEL)%'

    App\Service\StripeBillingService:
        arguments:
            $stripeSecretKey: '%env(string:default::STRIPE_SECRET_KEY)%'
            $stripeWebhookSecret: '%env(string:default::STRIPE_WEBHOOK_SECRET)%'
            $stripePricePlus: '%env(string:default::STRIPE_PRICE_PLUS)%'
            $stripePricePro: '%env(string:default::STRIPE_PRICE_PRO)%'

    Predis\Client:
        arguments:
            - '%env(REDIS_URL)%'
        public: false

    Predis\ClientInterface: '@Predis\Client'

    App\Service\IdempotencyService:
        arguments:
            $idempotencyCache: '@cache.idempotency'
            $redis: '@Predis\Client'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    app.jwt_is_active_authenticator:
        class: App\Security\Authenticator\JWTIsActiveAuthenticator
        parent: lexik_jwt_authentication.security.jwt_authenticator

    security.authenticator.json_login.not_logged_in:
        class: App\Security\Authenticator\CustomJsonLoginAuthenticator
        parent: security.authenticator.json_login
        # factory: [ '@Symfony\Bundle\SecurityBundle\DependencyInjection\Security\Factory\JsonLoginFactory', 'createAuthenticator']
        arguments:
            $userProvider: '@security.user.provider.concrete.email_provider'
            $successHandler: '@lexik_jwt_authentication.handler.authentication_success'
            $failureHandler: '@lexik_jwt_authentication.handler.authentication_failure'
            $options: 
                username_path: email
                check_path: user.login
                use_forward: false
                login_path: /login
                password_path: password
