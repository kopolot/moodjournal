framework:
    cache:
        prefix_seed: mooddic
        # Shared Redis for app pools (mood hints etc.)
        default_redis_provider: '%env(REDIS_URL)%'
        pools:
            cache.mood:
                adapter: cache.adapter.redis
                default_lifetime: 900

when@test:
    framework:
        cache:
            pools:
                cache.mood:
                    adapter: cache.adapter.array
