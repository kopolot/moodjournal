nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'X-Api-Key', 'Accept']
        expose_headers: ['Link']
        allow_credentials: false
        max_age: 3600
    paths:
        '^/': ~
