; Local dev defaults for the PHP-FPM container.
; Per-vhost overrides live in public/public/.user.ini.

[PHP]
memory_limit = 512M
max_execution_time = 300

[xdebug]
xdebug.mode = debug
xdebug.start_with_request = trigger
xdebug.trigger_value = 1
; Compose network gateway — IDE on the host listens on :9003
xdebug.client_host = 172.255.0.1
xdebug.client_port = 9003
xdebug.log_level = 0
